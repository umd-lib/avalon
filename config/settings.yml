name: 'Avalon Media System' # used in page titles
# UMD Customization
domain:
  host: av-local
  port: 3000
  protocol: http
# End UMD Customization
dropbox:
  # UMD Customization
  path: /masterfiles/dropbox
  upload_uri: /masterfiles/dropbox
  # End UMD Customization
  # google_drive:
  #   client_id: id
  #   client_secret: secret
  #   redis_token_store_url: redis://host:port # if different from Avalon's Redis
encoding:
  engine_adapter: ffmpeg
  presets_path: config/ffmpeg_presets.yml
mediainfo:
  path: '/usr/bin/mediainfo --urlencode' # Fixes mediainfo v20.03 bug with S3 presigned URL
ffmpeg:
  path: '/usr/bin/ffmpeg'
ffprobe:
  path: '/usr/bin/ffprobe'
email:
  mailer: :smtp
  config:
    address: mail-relay.university.edu
    port: 25
    enable_starttls_auto: false
  comments: 'avalon-comments@example.edu'
  notification: 'avalon-notifications@example.edu'
  support: 'avalon-support@example.edu'
  # Accessibility request form link displayed on item view page
  # accessibility_request_link: 'https://example.edu/a11y-form'
solr:
  configset: avalon
  configset_source_path: <%= File.join(Rails.root, 'solr', 'config') %>
  collection_options:
    async:
    auto_add_replicas:
    collection:
      config_name: avalon
    create_node_set:
    max_shards_per_node:
    num_shards: 1
    replication_factor:
    router:
      name:
      field:
    rule:
    shards:
    snitch:
app_controller:
  solr_and_fedora:
    raise_on_connection_error: false
app_job:
  solr_and_fedora:
    raise_on_connection_error: true
zookeeper:
  connection_str: "localhost:9983/configs"
streaming:
  server: :generic
  stream_token_ttl: 20 #minutes
  # UMD Customization
  content_path: '/streamfiles'
  # End UMD Customization
  rtmp_base: 'rtmp://localhost/avalon'
  http_base: 'http://localhost:3000/streams'
  default_quality: 'auto'
  # Referer header to use when making m3u8 requests to the streaming server which the streaming
  # server then uses to make auth callbacks.  This is useful to allow the streaming server to use
  # an alternate address (like an internal firewalled address) for avalon than the public address
  # auth_referer: http://127.0.0.1:3000
redis:
  url: 'redis://localhost:6379/0'
groups:
  system_groups: [administrator]
master_file_management:
  # UMD Customization
  strategy: 'move' #'delete', or 'move' (for move uncomment and configure next line)
  path: '/masterfiles/archive'
  # End UMD Customization
bib_retriever:
  default:
    protocol: sru
    # UMD Customization
    url: https://usmai-umcp.alma.exlibrisgroup.com/view/sru/01USMAI_UMCP
    query: rec.id=%{bib_id}
    # End UMD Customization
    retriever_class: 'Avalon::BibRetriever::SRU'
    retriever_class_require: 'avalon/bib_retriever/sru'
controlled_vocabulary:
  path: config/controlled_vocabulary.yml
encode_throttling:
  create_jobs_throttle_threshold: 2
  create_jobs_spacing: 5
  update_jobs_throttle_threshold: 3
  update_jobs_spacing: 10
auth:
  registerable: false # Set to false to disable new user registrations
  # UMD Customization
  configuration:
    - :name: CAS Login
      :provider: :saml
      :params:
        issuer: av-local
        idp_cert_fingerprint: 'B8:98:58:08:FA:42:BB:D2:86:14:49:61:8F:B9:BF:7B:45:1A:7C:67'
        idp_sso_target_url: https://shib.idm.umd.edu/shibboleth-idp/profile/SAML2/Redirect/SSO
        idp_slo_target_url: https://shib.idm.umd.edu/shibboleth-idp/profile/Logout
        uid_attribute: 'urn:oid:0.9.2342.19200300.100.1.1'
        idp_sso_target_url_runtime_params:
          request_uri: RelayState
        attribute_statements:
          email: ['urn:oid:0.9.2342.19200300.100.1.3']
          roles: ['urn:oid:1.3.6.1.4.1.5923.1.1.1.7']
        security:
          authn_requests_signed: true # Enable or not signature on AuthNRequest
          want_assertions_signed: true # Enable or not the requirement of signed assertion
          digest_method: http://www.w3.org/2000/09/xmldsig#sha1
          signature_method: http://www.w3.org/2000/09/xmldsig#rsa-sha1
          embed_sign: false
          metadata_signed: false # Enable or not signature on Metadata
        # request_attributes: {}
  # End UMD Customization
#   configuration:
#     - :name: Avalon Lti OAuth
#       :provider: :lti
#       :hidden: true
#       :params:
#         :oauth_credentials:
#           somekey: somesecret
# google_analytics_tracking_id: "someid"
supplemental_files:
  proxy: false
waveform:
  player_width: 1200 #pixels
  finest_zoom: 5 #seconds
  sample_rate: 41000
active_storage:
  service: local
  #bucket: supplementalfiles
controlled_digital_lending:
  enable: false
  # Choose whether every collection has CDL enabled or disabled by default
  collections_enabled: false
  default_lending_period: 'P14D' # ISO8601 duration format: P14D == 14.days, PT8H == 8.hours, etc.
# Caption default field also sets the default language information for transcript files
caption_default:
  # Language should be 3 letter ISO 639-2 code
  language: 'eng'
  name: 'English'
transcription:
  # Feature flag: when false, the enqueue controller actions and the
  # "Transcribe" / "Transcribe All Sections" buttons are disabled. Existing
  # TranscriptionRequests and the dashboard remain visible either way.
  enabled: false
  default_provider: aws_transcribe
  aws:
    # S3 bucket AWS Transcribe writes job output to. Required to use the aws_transcribe provider.
    output_bucket:
recaptcha:
  site_key: # Setting a site_key will enable recaptcha on the comments form
  secret_key: # Required along with site_key
  type: "v2_checkbox" # or "v3"
  v3:
    action: "comment"
    minimum_score: 0.5
derivative:
  # Choose whether collection managers and admins can download high quality derivatives
  allow_download: true
  # For S3 APIs, it is preferred to use presigned urls if possible. There is a method
  # for delivering these downloads via proxied stream if there are firewall rules or
  # other limitations that block clients from directly accessing the S3 instance.
  # See MasterFilesController#download_derivative
  use_presigned_url: true
# Maximum size for uploaded files in bytes (default is disabled)
#max_upload_size: 2147483648 # Use :none or comment out to disable limit
# Rack Multipart creates temporary files when processing multipart form data with a large payload.
# If the default system /tmp directory is storage constrained, you can define an alternative here. 
# Leave commented out to use the system default.
# tempfile:
#   location: '/tmp'

# UMD Customization
streaming_reserves:
  unit_name: 'Streaming Reserves'
disallow_aeon_request:
  collections:
    - Films@UM
  units:
    - Streaming Reserves
# End UMD Customization

# Enable read-only mode for disabling all save interactions with fedora and solr
# Does not affect actions that only affect the database
# This is useful when running long migrations
repository_read_only_mode: false
repository_read_only_mode_message: "🚧 Read-only mode: all content editing has been disabled 🚧"

# Kaminari pagination options to be used on the Blacklight index/search page
# Refer to https://www.rubydoc.info/gems/kaminari/1.2.2#helpers for possible options
# Comment out or remove this block to use blacklight defaults
search_pagination:
  theme: 'blacklight'
  window: 2
  left: 2
  right: 0
# Prevent publication of items ingested after compliance date if they lack
# captions or transcripts
accessibility_compliance:
  enforce: false
  compliance_date: '2026-04-24'
